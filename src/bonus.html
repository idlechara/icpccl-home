---
# URL and build settings: src/bonus.11tydata.js
---
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.name }}</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/img/icpc-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: clamp(1.5rem, 5vw, 4rem) 1rem;
  background: #fff;
  color: #0f172a;
  font-family: Roboto, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
}

figure {
  margin: 0;
  width: min(100%, 52rem);
  text-align: center;
}

/* Dark frame, white mat, soft shadow on the wall */
.frame {
  padding: clamp(0.9rem, 3vw, 2.25rem);
  background: #fff;
  border: clamp(8px, 1.5vw, 14px) solid #1f2937;
  box-shadow:
    inset 0 0 0 1px #e5e7eb,
    0 2px 4px rgba(15, 23, 42, 0.08),
    0 18px 40px rgba(15, 23, 42, 0.18);
}

.frame img {
  display: block;
  width: 100%;
  height: auto;
  border: 1px solid #d1d5db;
}

figcaption {
  max-width: 34rem;
  margin: 2rem auto 0;
  font-style: italic;
  font-size: 0.98rem;
  line-height: 1.6;
  color: #475569;
}

figcaption strong {
  display: block;
  margin-bottom: 0.35rem;
  font-style: normal;
  font-weight: 500;
  font-size: 0.72rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #0f172a;
}

.back {
  display: inline-block;
  margin-top: 2.5rem;
  font-size: 0.85rem;
  color: #0061cc;
}
  </style>
</head>
<body>
  <figure>
    <div class="frame">
      <img src="photo.jpg" width="1280" height="1013" alt="">
    </div>
    <figcaption hidden>
      <strong></strong>
      <span></span>
    </figcaption>
    <a class="back" href="/">← Volver a ICPC Chile</a>
  </figure>
  <script>
    // Title, caption and alt text live next to the photo (content.json), outside the repo
    fetch("content.json")
      .then((r) => (r.ok ? r.json() : Promise.reject()))
      .then(({ title, heading, caption, alt }) => {
        if (title) document.title = `${title} · {{ site.name }}`;
        if (alt) document.querySelector("img").alt = alt;
        const figcaption = document.querySelector("figcaption");
        figcaption.querySelector("strong").textContent = heading ?? "";
        figcaption.querySelector("span").textContent = caption ?? "";
        figcaption.hidden = false;
      })
      .catch(() => {});
  </script>
</body>
</html>
