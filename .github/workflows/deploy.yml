name: Deploy to R2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Ambiente
        type: choice
        options: [prod, staging]
        default: prod

concurrency:
  group: deploy-${{ inputs.target || 'prod' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and sync to R2
        run: bash scripts/deploy.sh "${{ inputs.target || 'prod' }}"
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_STAGING_BUCKET: ${{ secrets.R2_STAGING_BUCKET }}
          EASTER_EGG_KEYS: ${{ secrets.EASTER_EGG_KEYS }}
