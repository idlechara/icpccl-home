name: Deploy to R2

# The branch decides the environment: main → production, staging → staging.
# Run workflow (manual) redeploys the branch chosen in "Use workflow from".
run-name: >-
  Deploy ${{ github.ref_name == 'main' && 'prod' || 'staging' }} ·
  ${{ github.event_name == 'workflow_dispatch' && format('manual by {0}', github.actor) || github.event.head_commit.message }}

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    # Manual runs from any other branch don't deploy
    if: github.ref_name == 'main' || github.ref_name == 'staging'
    name: Deploy (${{ github.ref_name == 'main' && 'prod' || 'staging' }})
    runs-on: ubuntu-latest
    # GitHub Environment: selects the secrets, labels the run and lists it under
    # Deployments. Each environment only accepts its own branch (Deployment branches).
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ github.ref_name == 'main' && 'https://icpc.cl' || 'https://staging.icpc.cl' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # R2_BUCKET and the R2 keys are environment secrets (production / staging): each
      # environment has its own bucket and a token scoped to it. R2_ACCOUNT_ID and
      # EASTER_EGG_KEYS can be repository secrets.
      - name: Build and sync to R2
        run: bash scripts/deploy.sh "${{ github.ref_name == 'main' && 'prod' || 'staging' }}"
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          EASTER_EGG_KEYS: ${{ secrets.EASTER_EGG_KEYS }}
